# Worker serves the proxy AND the static frontend in one deploy (no CORS).
# Frontend bundle lives in ../dist — build it first:  (from repo root) npm run build
# Then, from the repo root:  npm run deploy
#   (npm run deploy asserts dist/ is an api bundle before shipping — never
#    call `wrangler deploy` directly, or a demo bundle can go live)
# Secrets (never in this file):  npx wrangler secret put SARVAM_API_KEY
name = "chatt"   # existing worker: chatt.lingadevaru203.workers.dev (+ ai.lingadevaru.in)
main = "src/index.ts"
compatibility_date = "2025-07-18"   # max supported by the pinned wrangler; our code uses nothing date-gated

[assets]
directory = "../dist"
not_found_handling = "single-page-application"

# Plain (non-secret) tunables. Secrets go via `wrangler secret put`.
[vars]
RATE_LIMIT = "20"
RATE_WINDOW_S = "60"
# Worst-case spend cap, and the ONLY limit that bounds cost regardless of who
# is asking. One uncached spoken reply is ~₹0.44 (TTS ₹0.40 + chat ₹0.04), so
# 300/day allowed ₹131/day — ₹3,938/month, against a ₹100/month budget.
# 50 caps a bad day at ~₹22 while leaving ample room for real traffic, since
# the greeting and project list are served from cache at ₹0.
# The monthly backstop is the spend alert on the Sarvam dashboard, not this.
DAILY_CEILING = "50"
CHAT_MODEL = "sarvam-105b-conversations"
# bulbul:v4-flash: latest TTS (10-2026) — sub-250ms first audio, ~40% faster
# than v3, ₹20 vs ₹30 per 10k chars. Voices are per-language persona IDs,
# NOT v3 short names; resolveTtsTarget in src/sarvam.ts maps lang → persona
# (ml/od fall back to v3, which still covers all 11 languages).
TTS_MODEL = "bulbul:v4-flash"
TTS_VOICE = "shubh_enhi_companion"
# saaras:v4 is the current default/recommended STT model. "unknown" lets it
# auto-detect, which is right here: a visitor may speak English or Kannada.
# The REST endpoint caps a request at 30s — keep CONFIG.maxRecordSeconds at 30.
STT_MODEL = "saaras:v4"
STT_LANG = "unknown"
# Public Turnstile site key (safe to expose — the widget needs it).
# Secret goes via `npx wrangler secret put TURNSTILE_SECRET` (never here).
# Without the secret the Worker runs unprotected (backward compatible).
TURNSTILE_SITE_KEY = "0x4AAAAAAENqS_v4DQqG_Ycd"
